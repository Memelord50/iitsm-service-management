spring.application.name=i-itsm
server.port=${APP_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/iitsm?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:iitsm}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
app.jwt-secret=${JWT_SECRET}
app.origin=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
app.storage=${FILE_STORAGE:./var/attachments}
app.seed=${SEED_DEMO:false}
app.seed-password=${DEMO_PASSWORD:}
app.mail-from=${MAIL_FROM:noreply@iitsm.local}
app.ai-url=${AI_URL:https://api.openai.com/v1/chat/completions}
app.ai-model=${AI_MODEL:gpt-4.1-mini}
app.ai-key=${AI_API_KEY:}
app.skill-threshold=${SKILL_THRESHOLD:60}
app.warning-thresholds=${SLA_WARNING_THRESHOLDS:50,80}
app.reopen-days=${REOPEN_DAYS:90}

spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.jackson.deserialization.accept-float-as-int=false
